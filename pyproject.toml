[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-representation-evidence-lab"
version = "0.1.0"
description = "A companion lab for tracing representation evidence in AI systems."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Hazem Ali"}
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
tokenizer = ["tiktoken>=0.7.0"]
hf-tokenizer = ["transformers>=4.40"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[project.scripts]
rep-evidence = "representation_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
